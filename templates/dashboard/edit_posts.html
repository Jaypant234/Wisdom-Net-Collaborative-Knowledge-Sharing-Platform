{% extends '../base/base.html' %}

{% block content %}

<div class="row">
    <!--left side bar-->
    <!--load left sidebar-->
    {% include './leftsidebar.html' %}

    {% load crispy_forms_tags %}
    <!--right side bar-->
    <div class="col-md-9">
        <h3>Edit Post</h3>
  
        <form action="" method="POST" style="width: 500px;" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form | crispy }}
            <button type="submit" class="btn btn-warning">Update Post</button>
        </form>
    </div>
</div>

{% endblock %}
